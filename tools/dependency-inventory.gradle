import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    rootProject.tasks.register('exportDependencyInventory') {
        doLast {
            def modules = new TreeSet<String>()
            rootProject.allprojects.each { project ->
                def configurations = ['debugRuntimeClasspath', 'releaseRuntimeClasspath',
                    'debugAndroidTestRuntimeClasspath', 'debugUnitTestRuntimeClasspath']
                    .collect { project.configurations.findByName(it) }.findAll { it != null && it.canBeResolved }
                def buildClasspath = project.buildscript.configurations.findByName('classpath')
                if (buildClasspath != null && buildClasspath.canBeResolved) configurations.add(buildClasspath)
                configurations.each { configuration ->
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            modules.add("${component.id.group}:${component.id.module}:${component.id.version}".toString())
                        }
                    }
                }
            }
            def destination = rootProject.file('test-results/dependency-inventory.json')
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson([maven: modules]))
            println "Exported ${modules.size()} resolved Maven dependencies"
        }
    }
}
